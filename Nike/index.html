<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <!-- <link rel="stylesheet" href="./css/fonts.css"> -->
    <link
      rel="shortcut icon"
      href="./icons/nike-favicon-48x48.ico"
      type="image/x-icon"
    />
    <script defer src="./js/index.js" type="module"></script>
    <title>Nike Air Mag</title>
  </head>
  <body class="page__body">
    <header class="header ">
      <div class="header__container container">
        <a href="/" class="logo header__logo">
          <img class="logo__image" src="./icons/logo-icon.svg" alt="Логотип Найк"/>
        </a>
        <nav class="menu header__menu" id="header__menu" aria-label="Главное меню">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="#air-mag" class="menu__link" lang="en">Air Mag</a>
            </li>
            <li class="menu__item">
              <a href="#size" class="menu__link">Размеры</a>
            </li>
            <li class="menu__item">
              <a href="#details" class="menu__link">Характеристики</a>
            </li>
            <li class="menu__item">
              <a href="#top-models" class="menu__link">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <a href="#" class="header__order">Сделать заказ</a>
          <div class="header__buttons">
            <button class="header__buttons-actions" aria-label="Поиск">
                <svg width="24" height="24">
                    <use class="header__buttons-icon" href="./icons/sprite.svg#search"></use>
                </svg>
            </button>
            <button class="header__buttons-actions" aria-label="Корзина">
                <svg width="24" height="24">
                    <use class="header__buttons-icon" href="./icons/sprite.svg#cart"></use>
                </svg>
            </button>
             <button class="burger" aria-expanded="false" aria-controls="header__menu" aria-label="Открыть меню"><span class="burger__body"></span></button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
