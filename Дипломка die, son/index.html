<!doctype html>
<html class="page" lang="en">
  <head>
    <title>Дайсон</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <script src="./js/index.js" defer></script>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="header__container">
        <div class="header__controls">
          <button class="burger">
            <svg class="burger__icon" width="50" height="50">
              <use href="./icons/header-sprite.svg#burger"></use>
            </svg>
          </button>
          <a href="#" class="header__logo">
            <img
              class="header__logo-img"
              width="183"
              height="77"
              src="./images/header-logo.png"
              alt="Логотип Дайсон"
            />
          </a>
        </div>
        <nav class="menu header__menu">
          <ul class="menu__list title_l">
            <a href="" class="menu__link"><li>О нас</li></a>
            <a href="" class="menu__link"><li>Доставка и оплата</li></a>
            <a href="" class="menu__link"><li>Регистрация продукта</li></a>
            <a href="" class="menu__link"><li>Сервис</li></a>
            <a href="" class="menu__link"><li>Сертификаты и лицензии</li></a>
          </ul>
        </nav>
        <button class="bag__button">
          <svg class="bag__icon" width="36" height="36">
            <use href="./icons/header-sprite.svg#bag"></use>
          </svg>
        </button>
      </div>
    </header>
    <section class="hero">
      <div class="hero__container container">
        <div class="hero__info">
          <h1 class="hero__title">
            Уникальные технологии для&nbsp;ухода за волосами
          </h1>
          <p class="text__l">
            Идеальная укладка для всех типов волос вместе&nbsp;с Dyson
          </p>
          <a href="#" class="hero__more-button button">Подробнее</a>
        </div>
      </div>
    </section>
  </body>
</html>
